<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uni-VOC 신고 접수 현황</title>
<link rel="icon" href="/static/assets/yu-mark.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --yu-blue:#153974;
    --yu-blue-dark:#0e2850;
    --yu-sky:#00aaca;
    --yu-gray:#9d9d9c;
    --yu-beige:#eae3d2;
    --bg:#f3f3f1;
    --panel:#fbfbfa;
    --border:#e7e5df;
    --text:#1c2530;
    --muted:#6b7280;
    --ok:#0f7a52;
    --ok-bg:#eaf7f1;
    --no:#c0392b;
    --no-bg:#fdf0ee;
    --pending:#8a5a00;
    --pending-bg:#fff8ea;
    --pastel-navy:#e6eaf3;
    --pastel-navy-border:#ccd4e6;
    --pastel-sky:#d9eef3;
    --pastel-sky-border:#aadce6;
    --pastel-beige:#f8f4ea;
    --pastel-beige-border:#eae3d2;
    --pastel-gray:#f2f2f1;
    --pastel-gray-border:#e2e2e0;
  }
  *{box-sizing:border-box;}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--yu-sky);
    outline-offset:2px;
  }
  body{
    margin:0;
    font-family:"Pretendard","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 100% 0%, rgba(0,170,202,.06), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(21,57,116,.05), transparent 35%),
      var(--bg);
    color:var(--text);
  }
  header{
    background:linear-gradient(120deg, var(--pastel-navy), var(--pastel-sky) 70%);
    padding:16px 28px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:4px;
    background:linear-gradient(90deg, var(--yu-blue-dark), var(--yu-blue), var(--yu-sky), var(--yu-beige));
    box-shadow:0 1px 6px rgba(21,57,116,.25);
  }
  /* staff.html과 동일한 문제(코드 리뷰/직접 테스트로 발견) — 좁은 화면에서 헤더 제목이
     글자 단위로 줄바꿈되던 것을 index.html과 같은 방식으로 고침. */
  header .brand{display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden;}
  header img.logo{height:24px;flex-shrink:0;}
  header .divider{width:1px;height:20px;background:var(--border);flex-shrink:0;}
  header .title{font-weight:600;font-size:14px;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .title small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header nav{display:flex;gap:8px;align-items:center;flex-shrink:0;}
  header a{
    color:var(--yu-blue);
    text-decoration:none;
    font-size:13px;
    background:var(--panel);
    border:1px solid var(--pastel-sky-border);
    border-radius:20px;
    padding:6px 13px;
    white-space:nowrap;
    flex-shrink:0;
  }
  header a:hover{color:#fff;background:var(--yu-blue);border-color:var(--yu-blue);}

  main{
    max-width:900px;
    margin:0 auto;
    padding:24px 20px 70px;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toolbar .tab{
    font-size:13px;
    color:var(--yu-blue);
    border:1px solid var(--pastel-navy-border);
    background:var(--pastel-navy);
    border-radius:20px;
    padding:7px 14px;
    cursor:pointer;
    font-family:inherit;
    position:relative;
  }
  .toolbar .tab.active{color:#fff;background:var(--yu-blue);border-color:var(--yu-blue);}
  .tab .new-dot{
    display:none;
    position:absolute;
    top:-3px;right:-3px;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--no);
    border:1.5px solid #fff;
  }
  .tab.has-new .new-dot{display:block;}
  .toolbar .refresh{
    font-size:13px;
    color:var(--muted);
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:20px;
    padding:7px 14px;
    cursor:pointer;
    font-family:inherit;
  }
  .toolbar .refresh:hover{color:var(--yu-blue);border-color:var(--yu-blue);}
  .live-indicator{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--muted);
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 0 rgba(15,122,82,.5);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(15,122,82,.5);}
    70%{box-shadow:0 0 0 6px rgba(15,122,82,0);}
    100%{box-shadow:0 0 0 0 rgba(15,122,82,0);}
  }
  .status-tabs{margin-top:-6px;}
  .status-tabs .tab{background:var(--pastel-gray);color:var(--text);border-color:var(--pastel-gray-border);}
  .status-tabs .tab.active{background:var(--text);border-color:var(--text);color:#fff;}

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:60px 20px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-top:3px solid var(--pastel-sky-border);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .card.cat-보안{border-top-color:#e0958a;}
  .card.cat-시설{border-top-color:#f0c866;}
  .card.cat-기타{border-top-color:var(--pastel-sky-border);}
  .card.is-new{animation:flashNew 2.4s ease-out 1;}
  @keyframes flashNew{
    0%{background:var(--pastel-sky);}
    100%{background:var(--panel);}
  }

  /* 실사용자 요청: "진짜 긴급에는... 소리가 좀 많이 나면서 깜빡깜빡거리면서 긴급이라는걸
     티낼 수 있으면 좋겠어" — is_emergency=true이고 아직 처리 전(open)인 카드는 처리 완료
     될 때까지 계속 빨갛게 깜빡여서 다른 카드들 사이에서도 눈에 확 띄게 함. 폴링마다
     목록 전체를 다시 그려도(innerHTML 교체) 애니메이션은 클래스만 있으면 계속 재생되는
     CSS 방식이라 깜빡임이 끊기지 않음. */
  .card.is-emergency{
    animation:emergencyBlink 1.1s ease-in-out infinite;
    border:2px solid #d6291a;
  }
  @keyframes emergencyBlink{
    0%,100%{background:var(--panel); box-shadow:0 0 0 0 rgba(214,41,26,.55);}
    50%{background:#fdeceb; box-shadow:0 0 0 8px rgba(214,41,26,0);}
  }
  .emergency-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    font-weight:800;
    color:#fff;
    background:#d6291a;
    border-radius:20px;
    padding:4px 12px;
    white-space:nowrap;
    animation:emergencyBadgeBlink 1.1s ease-in-out infinite;
  }
  @keyframes emergencyBadgeBlink{
    0%,100%{opacity:1;}
    50%{opacity:.55;}
  }
  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .card-head-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .cat-badge{
    font-size:12px;
    font-weight:700;
    border-radius:20px;
    padding:4px 12px;
    white-space:nowrap;
  }
  .cat-badge.cat-보안{color:#a1361f;background:#fbe9e5;}
  .cat-badge.cat-시설{color:#7a5900;background:#fdf3da;}
  .cat-badge.cat-기타{color:var(--yu-blue);background:var(--pastel-navy);}
  .card-head .meta{font-size:12.5px;color:var(--muted);}
  .status-badge{
    font-size:12px;
    font-weight:700;
    border-radius:20px;
    padding:4px 11px;
    white-space:nowrap;
  }
  .status-badge.open{color:var(--pending);background:var(--pending-bg);}
  .status-badge.resolved{color:var(--ok);background:var(--ok-bg);}

  .desc{font-size:14px;line-height:1.6;margin:6px 0 8px;white-space:pre-wrap;word-break:break-word;}
  .loc{font-size:13px;color:var(--yu-blue);font-weight:600;margin-bottom:4px;}
  .reporter{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .resolved-note{
    margin-top:10px;
    background:var(--ok-bg);
    border:1px solid var(--ok);
    border-radius:10px;
    padding:8px 12px;
    font-size:12.5px;
    color:var(--text);
  }
  .resolved-note b{color:var(--ok);}

  .decision-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn{
    font-size:13px;
    font-weight:600;
    border-radius:20px;
    padding:7px 15px;
    cursor:pointer;
    font-family:inherit;
    border:1px solid transparent;
  }
  .btn-resolve{color:var(--ok);background:var(--ok-bg);border-color:var(--ok);}
  .btn-resolve:hover{background:var(--ok);color:#fff;}
  .btn-reopen{color:var(--muted);background:var(--panel);border-color:var(--border);}
  .btn-reopen:hover{color:var(--yu-blue);border-color:var(--yu-blue);}
  .btn-delete{color:var(--no);background:var(--no-bg);border-color:var(--no);}
  .btn-delete:hover{background:var(--no);color:#fff;}
  .btn-edit{color:var(--yu-blue);background:var(--pastel-navy);border-color:var(--pastel-navy-border);}
  .btn-edit:hover{background:var(--yu-blue);color:#fff;}

  .edit-form{margin:8px 0 10px;padding:12px 14px;background:var(--pastel-gray);border:1px solid var(--pastel-gray-border);border-radius:10px;}
  .edit-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .edit-row:last-of-type{margin-bottom:0;}
  .edit-row label{width:48px;flex-shrink:0;font-size:12.5px;color:var(--muted);font-weight:600;}
  .edit-row input{
    flex:1;min-width:0;
    /* 모바일(iOS Safari)에서 입력창 포커스할 때 자동 확대되는 걸 막으려면 글자 크기가
       16px 이상이어야 함(index.html 쪽 동일 이슈 참고) */
    font-size:16px;font-family:inherit;
    padding:7px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);
  }

  .toast-wrap{
    position:fixed;
    top:16px;right:16px;
    z-index:999;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:320px;
  }
  .toast{
    background:var(--yu-blue-dark);
    color:#fff;
    border-radius:10px;
    padding:12px 16px;
    font-size:13px;
    line-height:1.5;
    box-shadow:0 10px 28px rgba(0,0,0,.25);
    animation:toastIn .25s ease-out;
  }
  @keyframes toastIn{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* 실사용자 요청: "직원 페이지는 직원 페이지 들어갈때마다 본인의 이름과 소속을 확인해서
     항상 로그를 남길 수 있도록" — 실제 신고 내용(개인정보 포함 가능)을 다루는 화면이라
     최소한 "누가 언제 들어왔는지"는 남기고 싶다는 취지. 정식 로그인은 아니라서 완전한
     접근 차단은 아니고, 화면을 덮어서 이름/소속을 입력해야 실제로 보이게 하는 가벼운
     체크인 게이트. 매번(새로고침 포함) 다시 뜸 — localStorage로 건너뛰게 하지 않음.
     (staff.html에도 동일한 게이트가 있음 — 페이지별로 page 값만 다르게 로그에 남김) */
  .gate-overlay{
    position:fixed;
    inset:0;
    background:rgba(21,27,38,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:2000;
  }
  .gate-overlay[hidden]{display:none;}
  .gate-box{
    background:var(--panel);
    border-radius:16px;
    padding:26px 24px 20px;
    max-width:360px;
    width:100%;
    box-shadow:0 12px 40px rgba(21,57,116,.3);
  }
  .gate-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .gate-desc{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:16px;}
  .gate-label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:10px 0 5px;}
  .gate-input{
    width:100%;
    font-size:16px;
    font-family:inherit;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
  }
  .gate-input:focus{border-color:var(--yu-sky);}
  .gate-error{font-size:12px;color:var(--no);margin-top:8px;min-height:14px;}
  .gate-confirm{
    width:100%;
    margin-top:14px;
    background:var(--yu-blue);
    color:#fff;
    font-size:13.5px;
    font-weight:700;
    font-family:inherit;
    border:none;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
  }
  .gate-confirm:hover{background:var(--yu-blue-dark);}
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-box" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="gate-title" id="gateTitle">직원 확인</div>
    <div class="gate-desc">이 페이지는 학생들이 신고한 안전/시설 신고 내용을 다루기 때문에, 들어올 때마다 이름과 소속을 남겨야 해요. 입력 즉시 접속 기록에 저장됩니다.</div>
    <label class="gate-label">이름</label>
    <input class="gate-input" id="gateName" type="text" autocomplete="name" placeholder="예: 홍길동" />
    <label class="gate-label">소속</label>
    <input class="gate-input" id="gateAffiliation" type="text" autocomplete="organization" placeholder="예: 학생지원팀, 보안팀" />
    <div class="gate-error" id="gateError"></div>
    <button class="gate-confirm" id="gateConfirmBtn" type="button">확인하고 들어가기</button>
  </div>
</div>

<!-- 코드 리뷰 지적: staff.html과 같은 문제 — 게이트가 화면만 덮고 키보드 Tab 이동은
     막지 않아서, 이름/소속 확인 없이도 Tab+Enter로 뒤에 깔린 처리 버튼을 누를 수
     있었음. inert로 확인 전까지 안쪽을 완전히 비활성화하고, initIncidentsGate()에서
     확인 시 제거함. -->
<div id="appRoot" inert>
<header>
  <div class="brand">
    <img class="logo" src="/static/assets/yu-logo.png" alt="영남대학교" />
    <div class="divider"></div>
    <div class="title">신고 접수 현황<small>캠퍼스 안전·시설 신고 대시보드 — 실시간 갱신</small></div>
  </div>
  <nav>
    <a href="/" target="_blank" rel="noopener">메인 챗봇</a>
    <a href="/staff" target="_blank" rel="noopener">인정신청 승인</a>
    <a href="/admin" target="_blank" rel="noopener">관리자</a>
  </nav>
</header>

<main>
  <div class="toolbar" id="catTabs">
    <button class="tab active" data-cat="">전체<span class="new-dot"></span></button>
    <button class="tab" data-cat="보안">🔒 보안<span class="new-dot"></span></button>
    <button class="tab" data-cat="시설">🛠️ 시설<span class="new-dot"></span></button>
    <button class="tab" data-cat="기타">📋 기타<span class="new-dot"></span></button>
    <div class="live-indicator"><span class="live-dot"></span>실시간 갱신 중</div>
  </div>
  <div class="toolbar status-tabs" id="statusTabs">
    <button class="tab active" data-status="open">접수(미처리)</button>
    <button class="tab" data-status="resolved">처리완료</button>
    <button class="tab" data-status="">전체 상태</button>
    <button class="refresh" id="refreshBtn">↻ 새로고침</button>
  </div>

  <div id="listArea"><div class="empty">불러오는 중입니다...</div></div>
</main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
let currentCategory = '';
let currentStatus = 'open';
let knownIds = new Set();
// 후속 답변(예: "흉기 들고 있었다")에서 뒤늦게 긴급으로 격상되는 경우도 있어서, 처음 볼 때
// 이미 긴급이었는지(새 신고 알림에서 다룸)뿐 아니라 "이미 알고 있던 건이 나중에 긴급으로
// 바뀌는 순간"도 잡아서 사이렌을 울리기 위해 별도로 추적함.
let knownEmergencyIds = new Set();
let firstLoad = true;
let editingId = null;  // 지금 "위치/인원/연락처 수정" 폼을 열어둔 카드의 id — 없으면 null
let pollTimer = null;

function startPolling() {
  if (!pollTimer) pollTimer = setInterval(() => loadReports(), 5000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// 실사용자 요청: "직원용 사이트에는 신고가 접수됐을 때 소리도 나오면 좋겠어" — 별도
// 오디오 파일 없이 Web Audio API로 짧은 2음 알림음을 그때그때 생성해서 재생함. 브라우저
// 자동재생 정책상 사용자가 페이지에서 한 번이라도 클릭/키입력을 하기 전에는 소리가 아예
// 안 날 수 있어서, 첫 클릭에 AudioContext를 미리 만들어(또는 resume) 둠 — 직원이 탭을
// 누르거나 새로고침 버튼만 눌러도 자연스럽게 풀리므로 실사용에는 문제 없음.
let audioCtx = null;
function ensureAudioContext() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      audioCtx = null;
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}
document.addEventListener('click', ensureAudioContext, { once: true });

function playNewReportSound() {
  const ctx = ensureAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime;
  // 짧게 두 음(솔→도 느낌) — 긴급함은 느껴지되 계속 반복돼도 거슬리지 않을 정도로 짧게.
  [{ delay: 0, freq: 880 }, { delay: 0.16, freq: 1046.5 }].forEach(({ delay, freq }) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, now + delay);
    gain.gain.exponentialRampToValueAtTime(0.35, now + delay + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.15);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + delay);
    osc.stop(now + delay + 0.16);
  });
}

// 실사용자 요청: "진짜 긴급에는... 소리가 좀 많이 나면서" — 평소 새 신고 알림음(짧고
// 조용한 2음)과 확실히 구분되도록, 사이렌처럼 주파수가 위아래로 훑는 소리를 더 크고
// 길게(3회 반복) 재생함. 긴급 신고가 새로 들어왔을 때만 한 번 울리고(카드 자체는 처리
// 완료 전까지 계속 깜빡여서 시각적으로는 계속 눈에 띔), 매 5초 폴링마다 반복 재생하진
// 않음(같은 열린 긴급 건마다 5초마다 사이렌이 울리면 오히려 업무 방해가 됨).
function playEmergencySound() {
  const ctx = ensureAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime;
  const sweepDuration = 0.35;
  const gap = 0.08;
  for (let i = 0; i < 3; i++) {
    const start = now + i * (sweepDuration + gap);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(600, start);
    osc.frequency.linearRampToValueAtTime(1200, start + sweepDuration / 2);
    osc.frequency.linearRampToValueAtTime(600, start + sweepDuration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.55, start + 0.03);
    gain.gain.setValueAtTime(0.55, start + sweepDuration - 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + sweepDuration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + sweepDuration + 0.02);
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}

// escapeHtml만으로는 큰따옴표(")가 안 이스케이프돼서 그대로 value="..." 안에 넣으면 속성이
// 깨질 수 있음(예: 신고자가 이름에 큰따옴표를 넣는 극단적인 경우) — 수정 폼 input의 value
// 속성용으로 별도로 큰따옴표까지 이스케이프.
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

function timeAgo(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { hour12: false });
  } catch (e) {
    return iso || '';
  }
}

function showToast(msg) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.remove(); }, 6000);
}

function renderCard(r, isNew, isEditing) {
  const cat = r.category || '기타';
  const reporterHtml = (r.reporter_name || r.reporter_contact)
    ? `신고자: ${escapeHtml(r.reporter_name || '(이름 미기재)')}${r.reporter_contact ? ' · ' + escapeHtml(r.reporter_contact) : ''}`
    : '신고자 정보 없음(익명 신고)';
  const resolvedHtml = r.status === 'resolved'
    ? `<div class="resolved-note">✓ <b>${escapeHtml(r.resolved_by || '처리자 미기재')}</b>님이 처리 완료했습니다 (${timeAgo(r.resolved_at)})${r.resolved_note ? '<br/>메모: ' + escapeHtml(r.resolved_note) : ''}</div>`
    : '';

  // 실사용자 피드백: "너무 세세하게 물어보면 긴급/응급때 귀찮을 수 있으니 일단 접수 —
  // 사람이 이야기해주면 직원용 페이지에서 업데이트되는 거로". 챗봇이 접수 시점엔 위치
  // 정도만(그것도 학생이 스스로 말했을 때만) 받고 인원수/이름/연락처는 아예 안 물어보니,
  // 여기서 직원이 통화/현장 확인 후 직접 채워 넣을 수 있게 함(POST /api/incidents/{id}/update).
  // 편집 폼을 열어둔 카드는 5초 자동 폴링이 덮어써서 타이핑 중인 내용이 날아가면 안
  // 되므로, 편집 시작(edit-toggle) 시 stopPolling()으로 자동 갱신 자체를 멈춰둠(아래
  // 클릭 핸들러 참고) — 그래서 여기서는 편집 중 카드가 다시 그려질 걱정 없이 단순하게
  // 매번 서버 데이터로 폼을 채우면 됨.
  const editFormHtml = `<div class="edit-form">
    <div class="edit-row">
      <label>위치</label>
      <input type="text" data-field="location" value="${escapeAttr(r.location || '')}" placeholder="예: 정문, 의대 1층 강의실" />
    </div>
    <div class="edit-row">
      <label>인원</label>
      <input type="text" data-field="people_count" value="${escapeAttr(r.people_count || '')}" placeholder="예: 3명, 혼자" />
    </div>
    <div class="edit-row">
      <label>이름</label>
      <input type="text" data-field="reporter_name" value="${escapeAttr(r.reporter_name || '')}" placeholder="신고자 이름(선택)" />
    </div>
    <div class="edit-row">
      <label>연락처</label>
      <input type="text" data-field="reporter_contact" value="${escapeAttr(r.reporter_contact || '')}" placeholder="전화번호/이메일(선택)" />
    </div>
    <div class="decision-row">
      <button class="btn btn-resolve" data-action="edit-save" data-id="${r.id}">저장</button>
      <button class="btn btn-reopen" data-action="edit-cancel" data-id="${r.id}">취소</button>
    </div>
  </div>`;

  const editToggleBtn = `<button class="btn btn-edit" data-action="edit-toggle" data-id="${r.id}">📍 위치/인원/연락처 추가·수정</button>`;
  const actionsHtml = r.status === 'resolved'
    ? `<div class="decision-row">
         ${editToggleBtn}
         <button class="btn btn-reopen" data-action="reopen" data-id="${r.id}">다시 접수 상태로 되돌리기</button>
         <button class="btn btn-delete" data-action="delete" data-id="${r.id}">삭제</button>
       </div>`
    : `<div class="decision-row">
         ${editToggleBtn}
         <button class="btn btn-resolve" data-action="resolve" data-id="${r.id}">처리 완료로 표시</button>
         <button class="btn btn-delete" data-action="delete" data-id="${r.id}">삭제</button>
       </div>`;

  // "긴급"은 처리 완료된 뒤까지 계속 깜빡일 필요는 없음(이미 대응이 끝났으니) — status가
  // open일 때만 깜빡임/배지를 켜고, resolved면 평소 카드처럼 조용히 보이게 함.
  const isEmergencyOpen = !!r.is_emergency && r.status !== 'resolved';

  return `<div class="card cat-${cat} ${isNew ? 'is-new' : ''} ${isEmergencyOpen ? 'is-emergency' : ''}" data-id="${r.id}" data-cat="${escapeAttr(cat)}" data-emergency="${r.is_emergency ? '1' : '0'}">
    <div class="card-head">
      <div class="card-head-left">
        ${isEmergencyOpen ? '<span class="emergency-badge">🚨 긴급</span>' : ''}
        <span class="cat-badge cat-${cat}">${escapeHtml(cat)}</span>
        <span class="status-badge ${r.status}">${r.status === 'resolved' ? '처리완료' : '접수'}</span>
        <span class="meta">${timeAgo(r.created_at)}</span>
      </div>
    </div>
    ${r.location ? `<div class="loc">📍 ${escapeHtml(r.location)}</div>` : ''}
    ${r.people_count ? `<div class="loc">👥 관련 인원: ${escapeHtml(r.people_count)}</div>` : ''}
    <div class="desc">${escapeHtml(r.description)}</div>
    <div class="reporter">${reporterHtml}</div>
    ${resolvedHtml}
    ${isEditing ? editFormHtml : actionsHtml}
  </div>`;
}

async function loadReports(opts = {}) {
  const params = new URLSearchParams();
  if (currentCategory) params.set('category', currentCategory);
  if (currentStatus) params.set('status', currentStatus);
  const url = '/api/incidents' + (params.toString() ? '?' + params.toString() : '');

  let data;
  try {
    const res = await fetch(url);
    data = await res.json();
  } catch (e) {
    document.getElementById('listArea').innerHTML = '<div class="empty">목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    document.getElementById('listArea').innerHTML = '<div class="empty">해당하는 신고가 없습니다.</div>';
  } else {
    document.getElementById('listArea').innerHTML = data.map(r => renderCard(r, false, r.id === editingId)).join('');
  }

  // 실시간 감지: 폴링으로 새로 들어온 신고를 찾아 토스트 + 알림음 + 카드 하이라이트 + 탭에 점 표시
  if (!firstLoad && !opts.silent) {
    const newlyArrived = data.filter(r => !knownIds.has(r.id));
    // 방금 처음 보는 신고 중 긴급인 것뿐 아니라, 이미 알고 있던(첫 접수 때는 긴급이
    // 아니었던) 신고가 후속 답변으로 뒤늦게 긴급 판정을 받은 경우도 놓치면 안 됨.
    const newlyEmergency = data.filter(r => r.is_emergency && !knownEmergencyIds.has(r.id));
    if (newlyArrived.length > 0 || newlyEmergency.length > 0) {
      // 실사용자 요청: "진짜 긴급에는... 소리가 좀 많이 나면서" — 새로 들어왔거나 방금
      // 긴급으로 격상된 건이 하나라도 있으면 평소 알림음 대신 더 크고 긴 사이렌음을 울림.
      if (newlyEmergency.length > 0) {
        playEmergencySound();
      } else if (newlyArrived.length > 0) {
        playNewReportSound();  // 실사용자 요청: "신고가 접수됐을 때 소리도 나오면 좋겠어"
      }
      newlyArrived.forEach(r => {
        const emergencyPrefix = r.is_emergency ? '🚨 긴급 ' : '📣 ';
        showToast(`${emergencyPrefix}새 신고가 접수되었습니다 (${r.category}) — ${r.description.slice(0, 40)}${r.description.length > 40 ? '...' : ''}`);
        const card = document.querySelector(`.card[data-id="${r.id}"]`);
        if (card) card.classList.add('is-new');
        if (r.category) {
          const tab = document.querySelector(`.tab[data-cat="${r.category}"]`);
          if (tab && currentCategory !== r.category) tab.classList.add('has-new');
        }
        const allTab = document.querySelector('.tab[data-cat=""]');
        if (allTab && currentCategory !== '') allTab.classList.add('has-new');
      });
      // 새로 들어온 게 아니라 격상된 것뿐이어도(이미 목록엔 있었으니) 토스트로 알려줌.
      newlyEmergency.filter(r => knownIds.has(r.id)).forEach(r => {
        showToast(`🚨 긴급 상황으로 격상되었습니다 (${r.category}) — ${r.description.slice(0, 40)}${r.description.length > 40 ? '...' : ''}`);
      });
    }
  }
  knownIds = new Set(data.map(r => r.id));
  knownEmergencyIds = new Set(data.filter(r => r.is_emergency).map(r => r.id));
  firstLoad = false;
}

document.getElementById('listArea').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if (action === 'resolve') {
    // 실사용자 요청: "처리완료하면 보안 위에 빨간 동그라미가 실시간으로 없어지면 좋겠어" —
    // .has-new 점은 원래 "탭을 눌러서 직접 봐야만" 지워지는 방식이라, 다른 탭을 보고 있는
    // 상태에서 알림만 보고 바로 처리 완료를 눌러도 그 카테고리 탭엔 점이 계속 남아있었음.
    // 카드가 다시 그려지기 전에(data-cat) 카테고리를 미리 기억해뒀다가, 처리 성공 시
    // clearNewDot으로 바로 지워줌(탭을 직접 클릭한 것과 동일한 효과).
    const reportCat = btn.closest('.card')?.dataset.cat || '';
    const resolvedBy = prompt('처리자 이름(또는 소속)을 입력해 주세요 — 처리 기록에 남습니다.');
    if (resolvedBy === null) return;
    const note = prompt('처리 메모를 남겨주세요 (선택 사항 — 비워두셔도 됩니다).') || null;
    btn.disabled = true;
    try {
      const res = await fetch(`/api/incidents/${id}/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ resolved_by: resolvedBy || null, note: note }),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || '처리 중 오류가 발생했습니다.');
        btn.disabled = false;
        return;
      }
      clearNewDot(reportCat);
      await loadReports({ silent: true });
    } catch (err) {
      alert('서버와 통신 중 오류가 발생했습니다.');
      btn.disabled = false;
    }
  } else if (action === 'reopen') {
    if (!confirm('이 신고를 다시 접수(미처리) 상태로 되돌리시겠습니까?')) return;
    btn.disabled = true;
    try {
      await fetch(`/api/incidents/${id}/reopen`, { method: 'POST' });
      await loadReports({ silent: true });
    } catch (err) {
      alert('서버와 통신 중 오류가 발생했습니다.');
      btn.disabled = false;
    }
  } else if (action === 'delete') {
    if (!confirm('이 신고를 삭제하시겠습니까? 삭제하면 되돌릴 수 없습니다.')) return;
    btn.disabled = true;
    try {
      const res = await fetch('/api/incidents/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [id] }),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || '삭제 중 오류가 발생했습니다.');
        btn.disabled = false;
        return;
      }
      knownIds.delete(id);
      await loadReports({ silent: true });
    } catch (err) {
      alert('서버와 통신 중 오류가 발생했습니다.');
      btn.disabled = false;
    }
  } else if (action === 'edit-toggle') {
    // 폼이 열려있는 동안 5초 자동 폴링이 카드를 다시 그리면 타이핑 중이던 내용이 날아가니,
    // 편집을 시작하는 순간 자동 갱신을 멈춰둠(저장/취소하면 다시 켬).
    editingId = id;
    stopPolling();
    await loadReports({ silent: true });
  } else if (action === 'edit-cancel') {
    editingId = null;
    startPolling();
    await loadReports({ silent: true });
  } else if (action === 'edit-save') {
    const card = btn.closest('.card');
    const getVal = (field) => card.querySelector(`[data-field="${field}"]`).value.trim();
    const payload = {
      location: getVal('location'),
      people_count: getVal('people_count'),
      reporter_name: getVal('reporter_name'),
      reporter_contact: getVal('reporter_contact'),
    };
    btn.disabled = true;
    try {
      const res = await fetch(`/api/incidents/${id}/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || '저장 중 오류가 발생했습니다.');
        btn.disabled = false;
        return;
      }
      editingId = null;
      startPolling();
      await loadReports({ silent: true });
    } catch (err) {
      alert('서버와 통신 중 오류가 발생했습니다.');
      btn.disabled = false;
    }
  }
});

// 탭에 붙는 빨간 점(.has-new)을 카테고리 하나만, 또는 전체 지우는 공용 함수 — 탭을 직접
// 클릭했을 때(아래)뿐 아니라, 처리 완료 버튼을 눌렀을 때도 같은 방식으로 점을 지운다
// (실사용자 요청: "처리완료하면 보안 위에 빨간 동그라미가 실시간으로 없어지면 좋겠어").
// "전체" 탭의 점은 다른 카테고리 탭에 아직 점이 남아있으면 그대로 두고, 하나도 안 남았을
// 때만 같이 지운다.
function clearNewDot(category) {
  if (category) {
    document.querySelector(`.tab[data-cat="${category}"]`)?.classList.remove('has-new');
  }
  const stillNew = Array.from(document.querySelectorAll('#catTabs .tab[data-cat]'))
    .some(t => t.dataset.cat !== '' && t.classList.contains('has-new'));
  if (!stillNew) {
    document.querySelector('.tab[data-cat=""]')?.classList.remove('has-new');
  }
}

// 탭(카테고리/상태) 전환이나 수동 새로고침은 "필터가 달라져서 안 보이던 항목이 갑자기
// 나타나는 것"일 뿐 실제로 새로 접수된 신고가 아님 — 이런 경우까지 "새 신고" 토스트를
// 띄우면 직원이 필터만 바꿔도 계속 알림이 떠서 오히려 혼란스러움. 그래서 이런 경우는 항상
// silent(토스트 없이 목록만 갱신 + knownIds 재설정)로 처리하고, 오직 아래 5초 자동
// 폴링(같은 필터를 계속 보고 있는 동안 시간이 흘러 진짜로 새 신고가 들어온 경우)에서만
// "새 신고 도착" 토스트를 띄운다.
document.querySelectorAll('#catTabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#catTabs .tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    tab.classList.remove('has-new');
    currentCategory = tab.dataset.cat;
    loadReports({ silent: true });
  });
});

document.querySelectorAll('#statusTabs .tab[data-status]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#statusTabs .tab[data-status]').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentStatus = tab.dataset.status;
    loadReports({ silent: true });
  });
});

document.getElementById('refreshBtn').addEventListener('click', () => loadReports({ silent: true }));

loadReports();
// 실사용자 요청: "실시간으로 알림도 떴으면!" — 별도 서버 인프라(WebSocket 등) 없이도
// 데모에서 충분히 "실시간"으로 느껴지도록 5초 폴링으로 새 신고를 감지해 토스트+알림음으로
// 알림(같은 필터를 유지한 채로 자동 갱신될 때만 — 위 설명 참고). 편집 폼이 열려있는 동안은
// stopPolling()으로 잠깐 멈췄다가 저장/취소하면 startPolling()으로 다시 켬.
startPolling();

// ---------------- 직원 확인 게이트 (실사용자 요청: "들어갈때마다 이름/소속 확인 + 로그") ----------------
// staff.html과 동일한 게이트 — 화면을 덮어서 이름/소속을 입력해야 실제로 보이게 하는
// 가벼운 체크인. 로그인이 아니라 완벽한 접근 차단은 아니지만 접속 기록은 매번 남는다.
// localStorage에 저장된 값(staff.html에서 입력했던 것 포함)을 기본값으로 채워 반복
// 입력 부담은 줄이되, "매번 확인"이라는 요청 취지상 자동으로 건너뛰지는 않는다.
(function initIncidentsGate(){
  const overlay = document.getElementById('gateOverlay');
  const nameInput = document.getElementById('gateName');
  const affInput = document.getElementById('gateAffiliation');
  const errorEl = document.getElementById('gateError');
  const confirmBtn = document.getElementById('gateConfirmBtn');

  nameInput.value = localStorage.getItem('univoc_staff_name') || '';
  affInput.value = localStorage.getItem('univoc_staff_affiliation') || '';

  async function confirmGate(){
    const name = nameInput.value.trim();
    const affiliation = affInput.value.trim();
    if(!name || !affiliation){
      errorEl.textContent = '이름과 소속을 둘 다 입력해줘야 들어갈 수 있어요.';
      return;
    }
    confirmBtn.disabled = true;
    errorEl.textContent = '';
    try{
      await fetch('/api/staff/access-log', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, affiliation, page: 'incidents'}),
      });
    }catch(e){
      // 로그 저장이 네트워크 문제로 실패해도 화면 자체는 볼 수 있게 진행 — 감사로그 하나
      // 때문에 정작 급한 업무(신고 확인)가 막히면 안 됨.
    }
    localStorage.setItem('univoc_staff_name', name);
    localStorage.setItem('univoc_staff_affiliation', affiliation);
    overlay.hidden = true;
    const root = document.getElementById('appRoot');
    if(root) root.removeAttribute('inert');
  }

  confirmBtn.addEventListener('click', confirmGate);
  [nameInput, affInput].forEach(el => el.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); confirmGate(); }
  }));
  nameInput.focus();
})();
</script>

</body>
</html>
